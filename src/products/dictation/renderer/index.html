<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; script-src 'self'"
    />
    <link rel="stylesheet" href="../../../assets/icons/icons.css" />
    <style>
      @font-face {
        font-family: 'Inter';
        src: url('../../../assets/InterVariable.ttf') format('truetype');
        font-weight: 100 900;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: transparent;
        overflow: hidden;
        user-select: none;
        cursor: default;
      }
      body {
        font-family:
          'Inter',
          -apple-system,
          sans-serif;
        color: #fff;
        -webkit-font-smoothing: antialiased;
      }
      /* The window itself is the pill: macOS blurs what's behind it (vibrancy); this only tints it. */
      .pill {
        box-sizing: border-box;
        height: 100%;
        padding: 12px 16px 13px;
        border-radius: 18px;
        background: rgba(28, 28, 30, 0.55);
        box-shadow: inset 0 0 0 0.5px rgba(255, 255, 255, 0.16);
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }
      .top {
        display: flex;
        align-items: center;
        gap: 9px;
      }
      .top img {
        width: 22px;
        height: 22px;
        border-radius: 5px;
      }
      .app {
        font-size: 14px;
        font-weight: 600;
        letter-spacing: -0.1px;
        flex: 1;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 4px;
        font-size: 13px;
        font-weight: 500;
        color: rgba(255, 255, 255, 0.45);
      }
      .brand i {
        transform: scale(0.8);
      }
      /* Thin bars that breathe with the voice; heights are eased every frame in main.ts. */
      .wave {
        display: flex;
        align-items: center;
        justify-content: space-between;
        height: 16px;
      }
      .wave span {
        width: 2.5px;
        height: 16px;
        border-radius: 1.25px;
        background: rgba(255, 255, 255, 0.82);
        transform: scaleY(0.2);
        will-change: transform;
      }
      /* Finishing: only the word, with a light sweeping across it. */
      .pill.finishing {
        justify-content: center;
        align-items: center;
      }
      .pill.finishing .top,
      .pill.finishing .wave {
        display: none;
      }
      .status {
        font-size: 14px;
        font-weight: 500;
      }
      .status.shimmer {
        color: transparent;
        background: linear-gradient(
            100deg,
            rgba(255, 255, 255, 0.42) 0%,
            rgba(255, 255, 255, 0.42) 38%,
            rgba(255, 255, 255, 1) 50%,
            rgba(255, 255, 255, 0.42) 62%,
            rgba(255, 255, 255, 0.42) 100%
          )
          0 0 / 250% 100%;
        -webkit-background-clip: text;
        background-clip: text;
        animation: sweep 1.6s linear infinite;
      }
      @keyframes sweep {
        from {
          background-position: 100% 0;
        }
        to {
          background-position: -150% 0;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .status.shimmer {
          animation: none;
          color: rgba(255, 255, 255, 0.8);
        }
      }
      .err {
        font-size: 12.5px;
        color: rgb(255, 160, 150);
      }
    </style>
  </head>
  <body>
    <div class="pill" id="pill">
      <div class="top">
        <img id="icon" alt="" hidden /><span class="app" id="app"></span
        ><span class="brand"><i class="i-waveform"></i>Machete</span>
      </div>
      <div class="wave" id="wave"></div>
      <div class="status" id="status" hidden></div>
    </div>
    <script src="main.js"></script>
  </body>
</html>
