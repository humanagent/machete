<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'self'"
    />
    <link rel="stylesheet" href="../machete.css" />
    <style>
      .panel {
        --line-height: 23px;
        display: flex;
        flex-direction: column;
        /* Drag it from anywhere that isn't the text: the top, the margins, the results column. */
        -webkit-app-region: drag;
      }
      .title {
        flex: none;
        height: 36px;
        padding: 0 18px;
        display: flex;
        align-items: center;
        font-weight: 550;
        color: var(--text-soft);
      }
      /* The sheet is content: opaque, set into the panel. */
      .sheet {
        position: relative;
        flex: 1;
        min-height: 0;
        margin: 0 var(--gap) var(--gap);
        padding: 12px 18px 34px 22px;
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        font:
          13px/var(--line-height) Menlo,
          var(--mono);
      }
      /* The text is drawn by #paint (to color headings and comments); the textarea on top only holds the
         caret and the selection. */
      .editor {
        position: relative;
        min-width: 0;
        -webkit-app-region: no-drag;
      }
      #paint,
      textarea {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0 0 20px;
        font: inherit;
        white-space: pre;
        overflow: hidden;
        tab-size: 4;
      }
      #paint {
        color: var(--calc-text);
        pointer-events: none;
      }
      #paint .h {
        color: var(--calc-heading);
      }
      #paint .v {
        color: var(--calc-variable);
      }
      #paint .c,
      textarea::placeholder {
        color: var(--calc-comment);
      }
      textarea {
        overflow-x: hidden;
        overflow-y: auto;
        resize: none;
        color: transparent;
        caret-color: var(--calc-text);
        cursor: text;
      }
      .results {
        padding: 0 0 20px 12px;
        overflow-y: auto;
        width: 160px;
        text-align: right;
        color: var(--calc-result);
      }
      .results div {
        height: var(--line-height);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .results div[data-v] {
        -webkit-app-region: no-drag;
      }
      .results div[data-v]:hover {
        color: var(--text);
        cursor: pointer;
      }
      .results div.copied {
        color: var(--calc-heading);
      }
      /* Shown in screen sharing or not. */
      #share {
        -webkit-app-region: no-drag;
        position: absolute;
        left: 12px;
        bottom: 6px;
        width: 30px;
        height: 26px;
        display: grid;
        place-items: center;
        border-radius: 13px;
        color: var(--calc-comment);
      }
      #share:hover {
        color: var(--text);
        background: var(--fill);
      }
      #share.on {
        color: var(--calc-result);
      }
      #share svg {
        width: 17px;
        height: 17px;
      }
    </style>
  </head>
  <body>
    <div class="panel">
      <div class="title">Calculator</div>
      <div class="sheet">
        <div class="editor">
          <pre id="paint" aria-hidden="true"></pre>
          <textarea
            id="sheet"
            wrap="off"
            spellcheck="false"
            autocomplete="off"
            placeholder="$20 in eur - 5%"
          ></textarea>
        </div>
        <div id="results" class="results"></div>
        <button id="share" type="button"></button>
      </div>
    </div>
    <script src="main.js"></script>
  </body>
</html>
