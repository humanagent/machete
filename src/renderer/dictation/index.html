<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; script-src 'self'"
    />
    <link rel="stylesheet" href="../../../assets/icons/icons.css" />
    <style>
      @font-face {
        font-family: 'Inter';
        src: url('../../../assets/InterVariable.ttf') format('truetype');
        font-weight: 100 900;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: transparent;
        overflow: hidden;
        user-select: none;
        cursor: default;
      }
      body {
        font-family:
          'Inter',
          -apple-system,
          sans-serif;
        color: #fff;
        -webkit-font-smoothing: antialiased;
      }
      /* The window itself is the pill: macOS blurs what's behind it (vibrancy); this only tints it. */
      .pill {
        box-sizing: border-box;
        height: 100%;
        padding: 11px 14px 12px;
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.06);
        box-shadow: inset 0 0 0 0.5px rgba(255, 255, 255, 0.18);
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }
      .top {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .top img {
        width: 18px;
        height: 18px;
        border-radius: 4px;
      }
      .app {
        font-size: 12.5px;
        font-weight: 600;
        flex: 1;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 4px;
        font-size: 12px;
        font-weight: 600;
        color: rgba(255, 255, 255, 0.55);
      }
      .brand i {
        transform: scale(0.75);
      }
      .wave {
        display: flex;
        align-items: center;
        justify-content: space-between;
        height: 12px;
      }
      .wave span {
        width: 6px;
        height: 3px;
        border-radius: 1.5px;
        background: rgba(255, 255, 255, 0.78);
        transition: height 0.08s linear;
      }
      .status {
        font-size: 11.5px;
        color: rgba(255, 255, 255, 0.75);
      }
      .err {
        color: rgb(255, 160, 150);
      }
    </style>
  </head>
  <body>
    <div class="pill" id="pill">
      <div class="top">
        <img id="icon" alt="" hidden /><span class="app" id="app"></span
        ><span class="brand"><i class="i-waveform"></i>Machete</span>
      </div>
      <div class="wave" id="wave"></div>
      <div class="status" id="status" hidden></div>
    </div>
    <script src="main.js"></script>
  </body>
</html>
