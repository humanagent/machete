<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'self'"
    />
    <link rel="stylesheet" href="../machete.css" />
    <style>
      .about {
        flex: none;
        display: flex;
        align-items: center;
        gap: 8px;
        border-top: 0.5px solid var(--line);
        padding: 8px 6px 4px 14px;
      }
      /* The selected text, in two lines at most. */
      #text {
        flex: 1;
        min-width: 0;
        font-size: 11.5px;
        color: var(--text-dim);
        display: -webkit-box;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 2;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <div class="panel column">
      <input id="ask" class="field" placeholder="What should change?" spellcheck="false" autocomplete="off" />
      <ol id="list" class="list"></ol>
      <div class="about">
        <div id="text"></div>
        <button id="ghost" class="ghost" type="button"></button>
      </div>
    </div>
    <script src="main.js"></script>
  </body>
</html>
