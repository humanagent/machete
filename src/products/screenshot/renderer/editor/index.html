<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; script-src 'self'"
    />
    <style>
      @font-face {
        font-family: 'Inter';
        src: url('../../../assets/InterVariable.ttf') format('truetype');
        font-weight: 100 900;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: transparent;
        overflow: hidden;
        user-select: none;
        cursor: default;
      }
      body {
        font:
          13px 'Inter',
          -apple-system,
          sans-serif;
        color: #fff;
        -webkit-font-smoothing: antialiased;
      }
      .panel {
        box-sizing: border-box;
        height: 100%;
        border-radius: 12px;
        background: rgba(24, 24, 26, 0.5);
        box-shadow: inset 0 0 0 0.5px rgba(255, 255, 255, 0.18);
        display: flex;
        flex-direction: column;
        -webkit-app-region: drag;
      }
      .view {
        flex: 1;
        min-height: 0;
        padding: 20px 20px 4px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      canvas {
        max-width: 100%;
        max-height: 100%;
        border-radius: 6px;
        box-shadow: 0 8px 26px rgba(0, 0, 0, 0.35);
      }
      .bar {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 12px 16px 14px;
      }
      .bar .space {
        flex: 1;
      }
      button {
        all: unset;
        -webkit-app-region: no-drag;
        box-sizing: border-box;
        height: 30px;
        padding: 0 12px;
        border-radius: 8px;
        line-height: 30px;
        background: rgba(255, 255, 255, 0.12);
      }
      button:hover {
        background: rgba(255, 255, 255, 0.2);
      }
      button:focus-visible {
        outline: 2px solid #5aa6ec;
      }
      button[aria-pressed='true'],
      #copy {
        background: #0a64d8;
      }
      button span {
        color: rgba(255, 255, 255, 0.65);
        margin-left: 6px;
      }
      .group {
        display: flex;
        gap: 6px;
      }
      .group.off {
        opacity: 0.35;
        pointer-events: none;
      }
      .swatch {
        width: 30px;
        padding: 0;
        background-size: cover;
        background-position: center;
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.3);
      }
      .swatch[aria-pressed='true'] {
        box-shadow:
          inset 0 0 0 1px rgba(0, 0, 0, 0.3),
          0 0 0 2px #5aa6ec;
      }
    </style>
  </head>
  <body>
    <div class="panel">
      <div class="view"><canvas id="canvas"></canvas></div>
      <div class="bar">
        <button id="frame" aria-pressed="true">Frame<span>F</span></button>
        <div class="group" id="backgrounds" role="group" aria-label="Background"></div>
        <div class="group" id="sizes" role="group" aria-label="Frame size"></div>
        <div class="space"></div>
        <button id="close">Close<span>esc</span></button>
        <button id="save">Save<span>⌘S</span></button>
        <button id="copy">Copy<span>↩</span></button>
      </div>
    </div>
    <script src="main.js"></script>
  </body>
</html>
