<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; script-src 'self'"
    />
    <link rel="stylesheet" href="../../../assets/icons/icons.css" />
    <style>
      @font-face {
        font-family: 'Inter';
        src: url('../../../assets/InterVariable.ttf') format('truetype');
        font-weight: 100 900;
      }
      html,
      body {
        margin: 0;
        background: transparent;
        overflow: hidden;
        user-select: none;
        cursor: default;
      }
      body {
        font-family:
          'Inter',
          -apple-system,
          sans-serif;
        color: #fff;
        -webkit-font-smoothing: antialiased;
      }
      .pill {
        margin: 8px;
        height: 76px;
        border-radius: 18px;
        background: rgba(74, 78, 84, 0.78);
        box-shadow: inset 0 0 0 0.5px rgba(255, 255, 255, 0.14);
        padding: 12px 16px;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }
      .top {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .top img {
        width: 24px;
        height: 24px;
        border-radius: 6px;
      }
      .app {
        font-size: 15px;
        font-weight: 600;
        flex: 1;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 14px;
        font-weight: 600;
        color: rgba(255, 255, 255, 0.55);
      }
      .brand i {
        width: 15px;
        height: 15px;
        display: inline-block;
        background: currentColor;
      }
      .wave {
        display: flex;
        align-items: center;
        justify-content: space-between;
        height: 18px;
      }
      .wave span {
        width: 8px;
        height: 4px;
        border-radius: 2px;
        background: rgba(255, 255, 255, 0.75);
        transition: height 0.08s linear;
      }
      .status {
        font-size: 13px;
        color: rgba(255, 255, 255, 0.7);
      }
      .err {
        color: rgb(255, 150, 140);
      }
    </style>
  </head>
  <body>
    <div class="pill" id="pill">
      <div class="top">
        <img id="icon" alt="" hidden /><span class="app" id="app"></span
        ><span class="brand"><i class="i-waveform"></i>Machete</span>
      </div>
      <div class="wave" id="wave"></div>
      <div class="status" id="status" hidden></div>
    </div>
    <script src="main.js"></script>
  </body>
</html>
