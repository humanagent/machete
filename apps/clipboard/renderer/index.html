<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'self'"
    />
    <link rel="stylesheet" href="../machete.css" />
    <style>
      /* The full text of the entry under the pointer (or selected with the keys). */
      .preview {
        border-left: 0.5px solid var(--line);
        padding: 14px 16px 10px;
        gap: 8px;
      }
      .preview pre {
        flex: 1;
        margin: 0;
        overflow-y: auto;
        white-space: pre-wrap;
        word-break: break-word;
        color: var(--text-soft);
        user-select: text;
        cursor: text;
      }
      .preview .meta {
        color: var(--text-dim);
        font-size: 11.5px;
      }
    </style>
  </head>
  <body>
    <div class="panel columns">
      <div class="column">
        <input
          id="search"
          class="field"
          placeholder="Search clipboard history"
          spellcheck="false"
          autocomplete="off"
        />
        <ol id="list" class="list"></ol>
        <div id="empty" class="empty" hidden>Nothing copied yet</div>
        <footer class="foot"><span>↩ paste · ⌘1–9 · ⌥⌫ delete</span><span>esc</span></footer>
      </div>
      <div class="column preview">
        <pre id="full" class="mono"></pre>
        <div id="meta" class="meta"></div>
      </div>
    </div>
    <script src="main.js"></script>
  </body>
</html>
