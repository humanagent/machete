<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'self'"
    />
    <style>
      @font-face {
        font-family: 'Inter';
        src: url('../../../assets/InterVariable.ttf') format('truetype');
        font-weight: 100 900;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: transparent;
        overflow: hidden;
        user-select: none;
        cursor: default;
      }
      body {
        font-family:
          'Inter',
          -apple-system,
          sans-serif;
        font-size: 13px;
        color: #fff;
        -webkit-font-smoothing: antialiased;
      }
      /* Same look as the clipboard panel: macOS blurs what's behind, this only tints it lightly. */
      .panel {
        box-sizing: border-box;
        height: 100%;
        border-radius: 12px;
        background: rgba(24, 24, 26, 0.22);
        box-shadow: inset 0 0 0 0.5px rgba(255, 255, 255, 0.18);
        display: grid;
        grid-template-columns: minmax(0, 1fr) 340px;
      }
      .side,
      .edit {
        display: flex;
        flex-direction: column;
        padding: 8px;
        gap: 6px;
        min-height: 0;
      }
      .edit {
        border-left: 0.5px solid rgba(255, 255, 255, 0.14);
        padding: 10px 12px 8px;
      }
      .bar {
        display: flex;
        gap: 6px;
      }
      input,
      textarea {
        all: unset;
        box-sizing: border-box;
        width: 100%;
        padding: 7px 10px;
        border-radius: 7px;
        background: rgba(255, 255, 255, 0.1);
        font-size: 14px;
        cursor: text;
        user-select: text;
      }
      textarea {
        flex: 1;
        white-space: pre-wrap;
        word-break: break-word;
        font:
          12.5px/1.45 ui-monospace,
          'SF Mono',
          Menlo,
          monospace;
      }
      input::placeholder,
      textarea::placeholder {
        color: rgba(255, 255, 255, 0.45);
      }
      button {
        all: unset;
        padding: 5px 10px;
        border-radius: 7px;
        background: rgba(255, 255, 255, 0.1);
        cursor: default;
      }
      button:hover {
        background: rgba(255, 255, 255, 0.18);
      }
      .add {
        font-size: 18px;
        line-height: 1;
        padding: 4px 11px 6px;
      }
      label {
        color: rgba(255, 255, 255, 0.55);
        font-size: 11px;
        margin-top: 4px;
      }
      ol {
        list-style: none;
        margin: 0;
        padding: 0;
        overflow-y: auto;
        flex: 1;
      }
      li {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 14px;
        padding: 5px 10px;
        border-radius: 6px;
        white-space: nowrap;
      }
      li .text {
        flex: 1;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      li .text.blank {
        color: rgba(255, 255, 255, 0.4);
      }
      li .abbr {
        flex: none;
        max-width: 120px;
        overflow: hidden;
        text-overflow: ellipsis;
        padding: 1px 8px;
        border-radius: 9px;
        background: rgba(255, 255, 255, 0.16);
        font-size: 12px;
      }
      li.selected {
        background: #0a64d8;
      }
      li.selected .abbr {
        background: rgba(255, 255, 255, 0.25);
      }
      .empty {
        padding: 24px 10px;
        text-align: center;
        color: rgba(255, 255, 255, 0.5);
      }
      footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 2px 4px 0 10px;
        color: rgba(255, 255, 255, 0.45);
        font-size: 11px;
      }
      footer button {
        font-size: 11px;
        padding: 3px 8px;
      }
      .warn {
        padding: 8px 10px;
        border-radius: 7px;
        background: rgba(255, 159, 10, 0.18);
        font-size: 12px;
        line-height: 1.4;
      }
      .warn button {
        margin-top: 6px;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <div class="panel">
      <div class="side">
        <div class="bar">
          <input id="search" placeholder="Search snippets" spellcheck="false" autocomplete="off" />
          <button id="add" class="add" title="New snippet (⌘N)">+</button>
        </div>
        <ol id="list"></ol>
        <div id="empty" class="empty" hidden>No snippets yet</div>
        <footer><span id="count"></span><span>↩ paste · ⌘N new · esc</span></footer>
      </div>
      <div class="edit">
        <div id="warn" class="warn" hidden>
          Abbreviations expand once macOS lets Machete see the keyboard (Input Monitoring).
          <br /><button id="allow">Allow…</button>
        </div>
        <label for="abbr">Abbreviation</label>
        <input id="abbr" placeholder=";sig" spellcheck="false" autocomplete="off" />
        <label for="content">Content</label>
        <textarea id="content" placeholder="The text it becomes" spellcheck="false"></textarea>
        <footer>
          <button id="importMac" title="Add the text replacements from System Settings › Keyboard">
            Import from macOS
          </button>
          <button id="remove">Delete</button>
        </footer>
      </div>
    </div>
    <script src="main.js"></script>
  </body>
</html>
