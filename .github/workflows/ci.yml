name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run native
      - run: bun run lint
      - run: bun test --coverage
