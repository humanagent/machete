<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; script-src 'self'"
    />
    <link rel="stylesheet" href="../machete.css" />
    <link rel="stylesheet" href="../../../assets/icons/icons.css" />
    <style>
      /* The window itself is the pill. */
      .pill {
        border-radius: var(--radius-pill);
        padding: 12px 18px 13px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }
      .top {
        display: flex;
        align-items: center;
        gap: 9px;
      }
      .top img {
        width: 22px;
        height: 22px;
        border-radius: 5px;
      }
      .app {
        font-size: 14px;
        font-weight: 600;
        flex: 1;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 4px;
        font-weight: 500;
        color: var(--text-dim);
      }
      .brand i {
        transform: scale(0.8);
      }
      .top .ghost {
        margin: -4px -8px -4px -4px;
      }
      /* Thin bars that breathe with the voice; heights are eased every frame in main.ts. */
      .wave {
        display: flex;
        align-items: center;
        justify-content: space-between;
        height: 16px;
      }
      .wave span {
        width: 2.5px;
        height: 16px;
        border-radius: 1.25px;
        background: var(--text-soft);
        transform: scaleY(0.2);
        will-change: transform;
      }
      /* Finishing: only the word, with a light sweeping across it. */
      .pill.finishing {
        justify-content: center;
        align-items: center;
      }
      .pill.finishing .top,
      .pill.finishing .wave {
        display: none;
      }
      .status {
        font-size: 14px;
        font-weight: 500;
      }
      .status.shimmer {
        color: transparent;
        background: linear-gradient(
            100deg,
            var(--text-dim) 0%,
            var(--text-dim) 38%,
            var(--text) 50%,
            var(--text-dim) 62%,
            var(--text-dim) 100%
          )
          0 0 / 250% 100%;
        -webkit-background-clip: text;
        background-clip: text;
        animation: sweep 1.6s linear infinite;
      }
      @keyframes sweep {
        from {
          background-position: 100% 0;
        }
        to {
          background-position: -150% 0;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .status.shimmer {
          color: var(--text-soft);
        }
      }
      .err {
        font-size: 12.5px;
        color: var(--bad);
      }
    </style>
  </head>
  <body>
    <div class="panel pill" id="pill">
      <div class="top">
        <img id="icon" alt="" hidden /><span class="app" id="app"></span
        ><span class="brand"><i class="i-waveform"></i>Machete</span
        ><button id="ghost" class="ghost" type="button"></button>
      </div>
      <div class="wave" id="wave"></div>
      <div class="status" id="status" hidden></div>
    </div>
    <script src="main.js"></script>
  </body>
</html>
