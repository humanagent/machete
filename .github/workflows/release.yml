name: Release
# Signed and notarized macOS build, attached to a GitHub release, on every v* tag.
# Repository secrets:
#   MAC_CERTIFICATE_P12          base64 of the "Developer ID Application" certificate (.p12)
#   MAC_CERTIFICATE_PASSWORD     its password
#   APPLE_API_KEY_P8             contents of the App Store Connect API key (.p8) used to notarize
#   APPLE_API_KEY_ID             its key id
#   APPLE_API_ISSUER             its issuer id
on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run verify
      - name: Notarization key
        run: echo "${{ secrets.APPLE_API_KEY_P8 }}" > "$RUNNER_TEMP/api-key.p8"
      - name: Build, sign and notarize
        run: bun run dist
        env:
          CSC_LINK: ${{ secrets.MAC_CERTIFICATE_P12 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY: ${{ runner.temp }}/api-key.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      - name: Verify the signature and the notarization ticket
        run: |
          APP=$(ls -d dist/mac-arm64/Machete.app)
          codesign --verify --deep --strict "$APP"
          spctl --assess --type execute --verbose "$APP"
          xcrun stapler validate "$APP"
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.dmg
            dist/*.zip
