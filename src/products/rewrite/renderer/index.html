<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'self'"
    />
    <style>
      @font-face {
        font-family: 'Inter';
        src: url('../../../assets/InterVariable.ttf') format('truetype');
        font-weight: 100 900;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: transparent;
        overflow: hidden;
        user-select: none;
        cursor: default;
      }
      body {
        font-family:
          'Inter',
          -apple-system,
          sans-serif;
        font-size: 13px;
        color: #fff;
        -webkit-font-smoothing: antialiased;
      }
      /* macOS blurs what's behind the window (vibrancy); this only tints it, lightly, like a menu. */
      .panel {
        box-sizing: border-box;
        height: 100%;
        border-radius: 12px;
        background: rgba(24, 24, 26, 0.22);
        box-shadow: inset 0 0 0 0.5px rgba(255, 255, 255, 0.18);
        display: flex;
        flex-direction: column;
        padding: 8px;
        gap: 6px;
      }
      /* The selected text, in two lines at most. */
      #text {
        flex: none;
        border-top: 0.5px solid rgba(255, 255, 255, 0.14);
        padding: 7px 10px 1px;
        font-size: 11px;
        line-height: 1.4;
        color: rgba(255, 255, 255, 0.5);
        display: -webkit-box;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 2;
        overflow: hidden;
      }
      input {
        all: unset;
        box-sizing: border-box;
        width: 100%;
        padding: 7px 10px;
        border-radius: 7px;
        background: rgba(255, 255, 255, 0.1);
        font-size: 14px;
        cursor: text;
      }
      input::placeholder {
        color: rgba(255, 255, 255, 0.45);
      }
      ol {
        list-style: none;
        margin: 0;
        padding: 0;
        overflow-y: auto;
        flex: 1;
      }
      li {
        display: flex;
        gap: 10px;
        font-size: 14px;
        padding: 5px 10px;
        border-radius: 6px;
        white-space: nowrap;
      }
      li .text {
        flex: 1;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      li .key {
        color: rgba(255, 255, 255, 0.45);
      }
      li.selected {
        background: #0a64d8;
      }
      li.selected .key {
        color: rgba(255, 255, 255, 0.8);
      }
      .empty {
        padding: 24px 10px;
        text-align: center;
        color: rgba(255, 255, 255, 0.5);
      }
      footer {
        display: flex;
        justify-content: space-between;
        padding: 2px 10px 0;
        color: rgba(255, 255, 255, 0.45);
        font-size: 11px;
      }
    </style>
  </head>
  <body>
    <div class="panel">
      <input id="ask" placeholder="What should change?" spellcheck="false" autocomplete="off" />
      <ol id="list"></ol>
      <div id="text"></div>
    </div>
    <script src="main.js"></script>
  </body>
</html>
