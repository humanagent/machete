<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; script-src 'self'"
    />
    <style>
      @font-face {
        font-family: 'Inter';
        src: url('../../../assets/InterVariable.ttf') format('truetype');
        font-weight: 100 900;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: transparent;
        overflow: hidden;
        user-select: none;
        cursor: default;
      }
      body {
        font:
          12px 'Inter',
          -apple-system,
          sans-serif;
        color: #fff;
        -webkit-font-smoothing: antialiased;
      }
      /* Newest at the bottom, nearest the corner. The sizes are PreviewsWindow's. */
      #stack {
        box-sizing: border-box;
        height: 100%;
        padding: 16px;
        display: flex;
        flex-direction: column-reverse;
        gap: 10px;
      }
      .card {
        position: relative;
        flex: none;
        width: 220px;
        height: 150px;
        border-radius: 12px;
        overflow: hidden;
        background: #1d1f25;
        box-shadow:
          0 6px 14px rgba(0, 0, 0, 0.38),
          inset 0 0 0 1px rgba(255, 255, 255, 0.18);
      }
      .card img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
      .card::after {
        content: '';
        position: absolute;
        inset: 0;
        border-radius: 12px;
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.22);
        pointer-events: none;
      }
      button {
        all: unset;
        position: absolute;
        box-sizing: border-box;
        height: 26px;
        padding: 0 11px;
        border-radius: 13px;
        line-height: 26px;
        font-weight: 500;
        background: rgba(16, 18, 23, 0.78);
        box-shadow: inset 0 0 0 0.5px rgba(255, 255, 255, 0.28);
      }
      button:hover {
        background: #0a64d8;
      }
      .close {
        top: 7px;
        left: 7px;
        width: 26px;
        padding: 0;
        text-align: center;
      }
      .copy {
        bottom: 7px;
        left: 7px;
      }
      .save {
        bottom: 7px;
        right: 7px;
      }
    </style>
  </head>
  <body>
    <div id="stack"></div>
    <script src="main.js"></script>
  </body>
</html>
