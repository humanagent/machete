<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; script-src 'self'"
    />
    <link rel="stylesheet" href="../machete.css" />
    <style>
      body {
        font-size: 12px;
      }
      /* Newest on top. The sizes are PreviewsWindow's. */
      #stack {
        height: 100%;
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      /* A glass edge around an opaque picture. Its border is see-through, so the corners' offsets are the picture's. */
      .card {
        position: relative;
        flex: none;
        width: 220px;
        height: 150px;
        border: 5px solid var(--surface);
        border-radius: var(--radius-card);
        overflow: hidden;
        background: var(--sheet) padding-box;
        box-shadow: var(--shadow);
      }
      .card img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: left top;
      }
      .card button {
        position: absolute;
        height: 26px;
        padding: 0 11px;
        border-radius: 13px;
        line-height: 26px;
        font-weight: 500;
        background: var(--veil);
        box-shadow: inset 0 0 0 0.5px var(--fill-strong);
        transition: opacity 0.14s;
      }
      .card:not(:hover, :focus-within) button {
        opacity: 0;
      }
      .card button:hover {
        background: var(--veil-hover);
      }
      .card .close,
      .card .duplicate,
      .card .edit {
        width: 26px;
        padding: 0;
        text-align: center;
      }
      .close {
        top: 7px;
        left: 7px;
      }
      .edit {
        top: 7px;
        right: 7px;
      }
      .duplicate {
        top: 7px;
        right: 39px;
      }
      svg {
        display: block;
        width: 14px;
        height: 14px;
        margin: 6px;
        fill: none;
        stroke: currentColor;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .copy {
        bottom: 7px;
        left: 7px;
      }
      .save {
        bottom: 7px;
        right: 7px;
      }
    </style>
  </head>
  <body>
    <div id="stack"></div>
    <script src="main.js"></script>
  </body>
</html>
