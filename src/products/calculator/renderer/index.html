<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'self'"
    />
    <style>
      @font-face {
        font-family: 'Inter';
        src: url('../../../assets/InterVariable.ttf') format('truetype');
        font-weight: 100 900;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: transparent;
        overflow: hidden;
        cursor: default;
      }
      body {
        font-family:
          'Inter',
          -apple-system,
          sans-serif;
        color: #fff;
        -webkit-font-smoothing: antialiased;
        --line: 23px;
      }
      /* Numi's night theme: an almost opaque dark sheet, orange headings, green results. */
      body {
        --bg: #28292d;
        --text: #e6e8ea;
        --heading: #f9c54e;
        --variable: #82c7ec;
        --comment: rgba(230, 232, 234, 0.4);
        --result: #a0ce4c;
        --mono: Menlo, monospace; /* Numi's font: Menlo Regular 13 */
      }
      .panel {
        box-sizing: border-box;
        height: 100%;
        border-radius: 12px;
        background: var(--bg);
        box-shadow: inset 0 0 0 1px #5d5e60;
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        padding: 48px 34px 48px 35px;
        font: 13px/var(--line) var(--mono);
        /* Drag it from anywhere that isn't the text: the top strip, the margins, the results column. */
        -webkit-app-region: drag;
        position: relative;
      }
      /* The text is drawn by #paint (to color headings and comments); the textarea on top only holds the
         caret and the selection. */
      .editor {
        position: relative;
        min-width: 0;
        -webkit-app-region: no-drag;
      }
      #paint,
      textarea {
        position: absolute;
        inset: 0;
        margin: 0;
        padding: 0 0 40px;
        font: inherit;
        white-space: pre;
        overflow: hidden;
        tab-size: 4;
      }
      #paint {
        color: var(--text);
        pointer-events: none;
      }
      #paint .h {
        color: var(--heading);
      }
      #paint .v {
        color: var(--variable);
      }
      #paint .c {
        color: var(--comment);
      }
      textarea {
        all: unset;
        position: absolute;
        inset: 0;
        font: inherit;
        white-space: pre;
        padding: 0 0 40px;
        overflow-x: hidden;
        overflow-y: auto;
        scrollbar-width: none;
        color: transparent;
        caret-color: var(--text);
        cursor: text;
      }
      textarea::selection {
        background: rgba(10, 100, 216, 0.55);
      }
      textarea::placeholder {
        color: var(--comment);
      }
      textarea::-webkit-scrollbar,
      .results::-webkit-scrollbar {
        display: none;
      }
      .results {
        margin: 0;
        padding: 0 0 40px 12px;
        overflow-y: auto;
        width: 170px; /* Numi's result pane */
        text-align: right;
        color: var(--result);
        user-select: none;
      }
      .results div {
        height: var(--line);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .results div[data-v] {
        -webkit-app-region: no-drag;
      }
      .results div[data-v]:hover {
        color: #fff;
        cursor: pointer;
      }
      .results div.copied {
        color: var(--heading);
      }
      /* Bottom left, where Numi has its gear: shown in screen sharing or not. */
      #share {
        all: unset;
        -webkit-app-region: no-drag;
        position: absolute;
        left: 12px;
        bottom: 10px;
        width: 22px;
        height: 22px;
        display: grid;
        place-items: center;
        border-radius: 6px;
        color: rgba(230, 232, 234, 0.4);
        cursor: default;
      }
      #share:hover {
        color: var(--text);
        background: rgba(255, 255, 255, 0.08);
      }
      #share.on {
        color: var(--result);
      }
      #share svg {
        width: 17px;
        height: 17px;
      }
    </style>
  </head>
  <body>
    <div class="panel">
      <div class="editor">
        <pre id="paint" aria-hidden="true"></pre>
        <textarea
          id="sheet"
          wrap="off"
          spellcheck="false"
          autocomplete="off"
          placeholder="$20 in eur - 5%"
        ></textarea>
      </div>
      <div id="results" class="results"></div>
      <button id="share" type="button"></button>
    </div>
    <script src="main.js"></script>
  </body>
</html>
